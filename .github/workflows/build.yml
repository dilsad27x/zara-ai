name: Build ZARA AI Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-disabled: true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests and Build APK
      run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --info

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ZaraAI-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release and Upload Direct APK Asset
      if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v0.1.0-debug
        name: ZARA AI v0.1.0 Debug Build
        body: |
          Automated CI Build for ZARA AI
          - Native Android Jetpack Compose + Material 3
          - Part 01 Foundation (Hilt, Room, DataStore, Security)
          - Part 02 Premium Futuristic UI (10 Screens, Multi-state Orb, Floating Assistant)
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
